<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>愿你天天快乐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-deep: #241634;
    --ink-mid: #3b2050;
    --dusk: #5a2c56;
    --cream: #f7ecd9;
    --gold: #e8b768;
    --gold-soft: #f3d9a4;
    --blush: #ef93a0;
    --jade: #7fc9a3;
    --sky-blue: #7c93c9;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background: var(--ink-deep);
    font-family: 'Noto Serif SC', serif;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at 50% 15%, var(--dusk) 0%, var(--ink-mid) 45%, var(--ink-deep) 100%);
    background-size: 100% 140%;
    animation: skyBreathe 18s ease-in-out infinite alternate;
    overflow: hidden;
  }

  @keyframes skyBreathe{
    0%{ background-position: 50% 0%; }
    100%{ background-position: 50% 30%; }
  }

  /* 星空 */
  .stars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, rgba(247,236,217,0.8), transparent),
      radial-gradient(1.5px 1.5px at 80% 15%, rgba(247,236,217,0.6), transparent),
      radial-gradient(1px 1px at 30% 35%, rgba(247,236,217,0.7), transparent),
      radial-gradient(1.5px 1.5px at 60% 10%, rgba(247,236,217,0.5), transparent),
      radial-gradient(1px 1px at 90% 40%, rgba(247,236,217,0.6), transparent),
      radial-gradient(1.5px 1.5px at 20% 55%, rgba(247,236,217,0.4), transparent),
      radial-gradient(1px 1px at 45% 8%, rgba(247,236,217,0.7), transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, rgba(247,236,217,0.3), transparent);
    background-repeat: repeat;
    background-size: 400px 400px;
    animation: twinkle 6s ease-in-out infinite alternate;
    opacity: 0.9;
  }
  @keyframes twinkle{ 0%{ opacity:0.5; } 100%{ opacity:1; } }

  .moon{
    position:absolute; top: 8%; right: 10%;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold-soft), var(--gold) 60%, transparent 75%);
    box-shadow: 0 0 60px 20px rgba(232,183,104,0.35);
    opacity: 0.85;
  }

  /* 主体内容 */
  .content{
    position:relative;
    z-index: 5;
    height: 100%;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 24px;
  }

  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--gold-soft);
    opacity: 0.85;
    margin-bottom: 18px;
  }

  .name-wrap{
    position:relative;
    margin-bottom: 10px;
  }

  #nameInput{
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(247,236,217,0.25);
    text-align: center;
    color: var(--cream);
    font-family: 'Ma Shan Zheng', 'Cormorant Garamond', serif;
    font-size: clamp(48px, 10vw, 96px);
    line-height: 1.25;
    padding: 6px 10px 10px;
    width: min(90vw, 720px);
    outline: none;
    caret-color: var(--gold);
    text-shadow: 0 0 30px rgba(232,183,104,0.35), 0 2px 18px rgba(0,0,0,0.35);
    transition: border-color .3s ease, text-shadow .3s ease;
    opacity: 0;
    animation: inkReveal 1.6s ease forwards 0.3s;
  }
  #nameInput:focus{
    border-bottom-color: var(--gold);
    text-shadow: 0 0 40px rgba(232,183,104,0.55), 0 2px 18px rgba(0,0,0,0.35);
  }
  #nameInput::placeholder{ color: rgba(247,236,217,0.4); }

  .hint{
    font-family:'Cormorant Garamond', serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: rgba(247,236,217,0.4);
    margin-top: 2px;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1.6s;
  }

  @keyframes inkReveal{
    0%{ opacity:0; filter: blur(10px); letter-spacing: 0.3em; }
    60%{ filter: blur(0px); }
    100%{ opacity:1; filter: blur(0px); letter-spacing: normal; }
  }
  @keyframes fadeIn{ to{ opacity:1; } }

  .wish-line{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(16px, 2.2vw, 22px);
    color: var(--cream);
    opacity: 0;
    letter-spacing: 0.06em;
    margin-top: 22px;
    animation: fadeIn 1.4s ease forwards 2.1s;
  }
  .wish-line .cn{
    font-family: 'Noto Serif SC', serif;
    font-style: normal;
    font-weight: 600;
    font-size: 1.35em;
    color: var(--gold);
    letter-spacing: 0.25em;
    display: inline-block;
    margin: 0 6px;
  }

  /* 飘字灯笼层 */
  .lantern-field{
    position:absolute; inset:0;
    pointer-events:none;
    z-index: 3;
  }

  .lantern{
    position:absolute;
    bottom: -140px;
    left: var(--x);
    animation: rise var(--dur) linear var(--delay) forwards;
    will-change: transform, opacity;
  }

  .lantern .sway{
    animation: sway var(--swaydur) ease-in-out var(--delay) infinite alternate;
  }

  .lantern .pill{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    padding: 9px 20px;
    border-radius: 999px;
    font-family: 'Noto Serif SC', serif;
    font-weight: 500;
    font-size: var(--size, 16px);
    white-space: nowrap;
    color: var(--cream);
    background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
    border: 1px solid rgba(247,236,217,0.18);
    backdrop-filter: blur(1px);
    box-shadow: 0 0 22px var(--glow, rgba(232,183,104,0.25));
  }

  .lantern .pill::before{
    content:'';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dot, var(--gold));
    box-shadow: 0 0 8px var(--dot, var(--gold));
    flex: 0 0 auto;
  }

  @keyframes rise{
    0%{ transform: translateY(0); opacity: 0; }
    8%{ opacity: 1; }
    88%{ opacity: 1; }
    100%{ transform: translateY(-118vh); opacity: 0; }
  }
  @keyframes sway{
    from{ transform: translateX(calc(var(--swayamp) * -1)); }
    to{ transform: translateX(var(--swayamp)); }
  }

  footer{
    position:absolute;
    bottom: 18px; left: 0; right:0;
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: rgba(247,236,217,0.3);
    z-index: 6;
  }

  /* 打开画廊的按钮 */
  .btn-row{
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 34px;
  }
  .gallery-btn{
    margin-top: 0;
    padding: 12px 34px;
    border-radius: 999px;
    border: 1px solid rgba(232,183,104,0.55);
    background: linear-gradient(135deg, rgba(232,183,104,0.14), rgba(239,147,160,0.08));
    color: var(--gold-soft);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 16px;
    letter-spacing: 0.12em;
    cursor: pointer;
    opacity: 0;
    animation: fadeIn 1.2s ease forwards 2.6s;
    transition: box-shadow .3s ease, transform .3s ease, background .3s ease;
  }
  .gallery-btn-alt{
    border-color: rgba(127,201,163,0.5);
    background: linear-gradient(135deg, rgba(127,201,163,0.14), rgba(124,147,201,0.08));
    color: #d7ecdf;
    animation-delay: 2.85s;
  }
  .gallery-btn-alt:hover{
    box-shadow: 0 0 30px rgba(127,201,163,0.3);
    background: linear-gradient(135deg, rgba(127,201,163,0.22), rgba(124,147,201,0.14));
  }
  .gallery-btn:hover{
    box-shadow: 0 0 30px rgba(232,183,104,0.35);
    transform: translateY(-2px);
    background: linear-gradient(135deg, rgba(232,183,104,0.22), rgba(239,147,160,0.14));
  }
  .gallery-btn:active{ transform: translateY(0); }

  /* 图片画廊遮罩 */
  .gallery-overlay{
    position: fixed; inset: 0;
    z-index: 50;
    background: radial-gradient(ellipse at 50% 40%, rgba(58,32,74,0.92), rgba(20,12,28,0.97));
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
  }
  .gallery-overlay.open{
    opacity: 1;
    pointer-events: auto;
  }

  .gallery-close{
    position: absolute;
    top: 22px; right: 26px;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(247,236,217,0.35);
    background: rgba(255,255,255,0.04);
    color: var(--cream);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, transform .2s ease;
  }
  .gallery-close:hover{ background: rgba(255,255,255,0.12); transform: rotate(90deg); }

  .gallery-slide{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    opacity: 0;
    transform: scale(0.94);
    transition: opacity .22s ease, transform .32s ease;
    padding: 20px;
  }
  .gallery-slide.show{ opacity: 1; transform: scale(1); }

  .gallery-slide svg{
    width: min(46vw, 220px);
    height: min(46vw, 220px);
    filter: drop-shadow(0 0 26px rgba(232,183,104,0.25));
  }

  .gallery-caption{
    font-family: 'Noto Serif SC', serif;
    font-weight: 500;
    font-size: clamp(20px, 3.4vw, 30px);
    color: var(--cream);
    letter-spacing: 0.08em;
    text-align: center;
  }
  .gallery-caption .lang-tag{
    display:block;
    margin-top: 6px;
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: rgba(247,236,217,0.45);
    text-transform: uppercase;
  }

  .gallery-progress{
    position:absolute;
    bottom: 34px; left: 50%;
    transform: translateX(-50%);
    display:flex; gap:6px;
  }
  .gallery-progress span{
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(247,236,217,0.25);
    transition: background .2s ease, transform .2s ease;
  }
  .gallery-progress span.active{
    background: var(--gold);
    transform: scale(1.5);
  }

  /* 拍立得照片边框 */
  .polaroid{
    background: var(--cream);
    padding: 14px 14px 24px;
    border-radius: 3px;
    box-shadow: 0 18px 45px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04);
    display: inline-block;
    position: relative;
  }
  .polaroid img,
  .polaroid .placeholder-photo{
    display: block;
    width: min(60vw, 260px);
    height: min(60vw, 260px);
    object-fit: cover;
    background: linear-gradient(135deg, #4a2d55, #6a3a63);
  }
  .polaroid .placeholder-photo{
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .polaroid .placeholder-photo svg{
    width: 40%; height: 40%;
    filter: none;
    opacity: 0.55;
  }
  .polaroid .tape{
    position: absolute;
    top: -10px; left: 50%;
    transform: translateX(-50%) rotate(-3deg);
    width: 60px; height: 20px;
    background: rgba(232,183,104,0.35);
    border: 1px solid rgba(232,183,104,0.2);
    opacity: 0.85;
  }
  .polaroid-caption{
    position: absolute;
    bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: #3b2a2a;
    letter-spacing: 0.03em;
  }

  @media (max-width: 560px){
    .moon{ width: 56px; height:56px; top:6%; right:8%; }
    .lantern .pill{ padding: 7px 14px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="stars"></div>
  <div class="moon"></div>

  <div class="content">
    <div class="eyebrow">A Wish For You · 送给你的祝福</div>
    <div class="name-wrap">
      <input id="nameInput" type="text" value="我的朋友" maxlength="16" spellcheck="false" />
    </div>
    <div class="hint">点击上方名字，写下 TA 的名字</div>
    <div class="wish-line">愿这世间所有温柔都恰好落在你身上 · 愿你<span class="cn">天天快乐</span>常伴身旁</div>
    <div class="btn-row">
      <button class="gallery-btn" id="openGallery" type="button">展开一场祝福 · Open a Wish</button>
      <button class="gallery-btn gallery-btn-alt" id="openPhotos" type="button">看看你的样子 · Our Moments</button>
    </div>
  </div>

  <div class="gallery-overlay" id="galleryOverlay">
    <button class="gallery-close" id="closeGallery" type="button" aria-label="关闭">✕</button>
    <div class="gallery-slide" id="gallerySlide"></div>
    <div class="gallery-progress" id="galleryProgress"></div>
  </div>

  <div class="gallery-overlay" id="photoOverlay">
    <button class="gallery-close" id="closePhotos" type="button" aria-label="关闭">✕</button>
    <div class="gallery-slide" id="photoSlide"></div>
    <div class="gallery-progress" id="photoProgress"></div>
  </div>

  <div class="lantern-field" id="lanternField"></div>

  <footer>MAY EVERY DAY BE A GOOD DAY</footer>
</div>

<script>
  const phrases = [
    { text: "天天快乐", lang: "中文" },
    { text: "Happy every day", lang: "English" },
    { text: "毎日楽しく", lang: "日本語" },
    { text: "매일 행복하세요", lang: "한국어" },
    { text: "Bonheur chaque jour", lang: "Français" },
    { text: "Feliz cada día", lang: "Español" },
    { text: "Jeden Tag glücklich", lang: "Deutsch" },
    { text: "Felice ogni giorno", lang: "Italiano" },
    { text: "Feliz todos os dias", lang: "Português" },
    { text: "Счастья каждый день", lang: "Русский" },
    { text: "سعيد كل يوم", lang: "العربية" },
    { text: "रोज़ खुश रहो", lang: "हिन्दी" },
    { text: "มีความสุขทุกวัน", lang: "ไทย" },
    { text: "Vui vẻ mỗi ngày", lang: "Tiếng Việt" },
    { text: "Ευτυχισμένος κάθε μέρα", lang: "Ελληνικά" },
    { text: "שמח כל יום", lang: "עברית" },
    { text: "Szczęścia każdego dnia", lang: "Polski" },
    { text: "Her gün mutlu ol", lang: "Türkçe" },
    { text: "Elke dag gelukkig", lang: "Nederlands" },
    { text: "Glad varje dag", lang: "Svenska" },
    { text: "天天开心", lang: "中文" },
    { text: "Bahagia setiap hari", lang: "Bahasa Indonesia" }
  ];

  const glowColors = [
    { glow: "rgba(232,183,104,0.35)", dot: "#e8b768" }, // gold
    { glow: "rgba(239,147,160,0.32)", dot: "#ef93a0" }, // blush
    { glow: "rgba(127,201,163,0.30)", dot: "#7fc9a3" }, // jade
    { glow: "rgba(124,147,201,0.30)", dot: "#7c93c9" }  // sky blue
  ];

  const field = document.getElementById('lanternField');
  let count = 0;
  const MAX_ON_SCREEN = 16;

  function spawnLantern(){
    if (count >= MAX_ON_SCREEN) return;
    const item = phrases[Math.floor(Math.random() * phrases.length)];
    const color = glowColors[Math.floor(Math.random() * glowColors.length)];

    const outer = document.createElement('div');
    outer.className = 'lantern';
    const x = Math.random() * 88 + 4; // 4% - 92%
    const dur = (Math.random() * 6 + 11).toFixed(1); // 11s - 17s
    const delay = 0;
    const swaydur = (Math.random() * 2 + 3).toFixed(1);
    const swayamp = (Math.random() * 18 + 10).toFixed(0) + 'px';
    const size = (Math.random() * 6 + 14).toFixed(0) + 'px';

    outer.style.setProperty('--x', x + 'vw');
    outer.style.setProperty('--dur', dur + 's');
    outer.style.setProperty('--delay', delay + 's');
    outer.style.setProperty('--swaydur', swaydur + 's');
    outer.style.setProperty('--swayamp', swayamp);

    const sway = document.createElement('div');
    sway.className = 'sway';

    const pill = document.createElement('div');
    pill.className = 'pill';
    pill.style.setProperty('--glow', color.glow);
    pill.style.setProperty('--dot', color.dot);
    pill.style.setProperty('--size', size);
    pill.textContent = item.text;

    sway.appendChild(pill);
    outer.appendChild(sway);
    field.appendChild(outer);
    count++;

    outer.addEventListener('animationend', (e) => {
      if (e.target === outer) {
        outer.remove();
        count--;
      }
    });
  }

  // 初始密集一些，随后按间隔持续飘出
  for (let i = 0; i < 8; i++){
    setTimeout(spawnLantern, i * 400);
  }
  setInterval(spawnLantern, 900);

  // 姓名输入框：自适应宽度、聚焦全选，方便直接输入
  const nameInput = document.getElementById('nameInput');
  nameInput.addEventListener('focus', () => nameInput.select());
  nameInput.addEventListener('input', () => {
    if (!nameInput.value.trim()) return;
  });

  /* ---------- 图片画廊：手绘祝福插画快速切换 ---------- */

  const svgIcons = {
    lantern: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="35" y1="8" x2="35" y2="18" stroke="#e8b768" stroke-width="1.5"/>
      <line x1="65" y1="8" x2="65" y2="18" stroke="#e8b768" stroke-width="1.5"/>
      <ellipse cx="35" cy="45" rx="16" ry="22" fill="#e8b768" opacity="0.85"/>
      <ellipse cx="65" cy="55" rx="14" ry="19" fill="#ef93a0" opacity="0.85"/>
      <rect x="30" y="20" width="10" height="6" rx="2" fill="#f7ecd9"/>
      <rect x="60" y="33" width="10" height="6" rx="2" fill="#f7ecd9"/>
      <line x1="35" y1="67" x2="35" y2="76" stroke="#e8b768" stroke-width="1.5"/>
      <line x1="65" y1="74" x2="65" y2="83" stroke="#ef93a0" stroke-width="1.5"/>
    </svg>`,
    blossom: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 15 C55 25 55 25 50 35 C45 25 45 25 50 15Z" fill="#ef93a0"/>
      <path d="M50 15 C55 25 55 25 50 35 C45 25 45 25 50 15Z" fill="#ef93a0" transform="rotate(72 50 25)"/>
      <path d="M50 15 C55 25 55 25 50 35 C45 25 45 25 50 15Z" fill="#ef93a0" transform="rotate(144 50 25)"/>
      <path d="M50 15 C55 25 55 25 50 35 C45 25 45 25 50 15Z" fill="#ef93a0" transform="rotate(216 50 25)"/>
      <path d="M50 15 C55 25 55 25 50 35 C45 25 45 25 50 15Z" fill="#ef93a0" transform="rotate(288 50 25)"/>
      <circle cx="50" cy="25" r="4" fill="#e8b768"/>
      <path d="M50 40 C40 55 35 70 30 85" stroke="#7fc9a3" stroke-width="1.5" fill="none"/>
      <path d="M50 40 C60 55 65 70 70 85" stroke="#7fc9a3" stroke-width="1.5" fill="none" opacity="0.6"/>
    </svg>`,
    moon: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M62 20 A32 32 0 1 0 62 80 A25 25 0 1 1 62 20Z" fill="#f3d9a4"/>
      <circle cx="25" cy="25" r="1.6" fill="#f7ecd9"/>
      <circle cx="18" cy="45" r="1.2" fill="#f7ecd9"/>
      <circle cx="30" cy="65" r="1.4" fill="#f7ecd9"/>
      <circle cx="15" cy="60" r="1" fill="#f7ecd9"/>
    </svg>`,
    firework: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      ${Array.from({length: 10}).map((_,i)=>{
        const a = (i/10)*Math.PI*2;
        const x1 = 50 + Math.cos(a)*10, y1 = 50 + Math.sin(a)*10;
        const x2 = 50 + Math.cos(a)*34, y2 = 50 + Math.sin(a)*34;
        const c = i % 3 === 0 ? '#e8b768' : (i % 3 === 1 ? '#ef93a0' : '#7fc9a3');
        return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`;
      }).join('')}
      <circle cx="50" cy="50" r="5" fill="#f7ecd9"/>
    </svg>`,
    heart: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 78 C20 58 12 40 24 27 C33 17 47 21 50 33 C53 21 67 17 76 27 C88 40 80 58 50 78Z" fill="#ef93a0" opacity="0.9"/>
      <circle cx="72" cy="24" r="2" fill="#f3d9a4"/>
      <circle cx="80" cy="34" r="1.3" fill="#f3d9a4"/>
      <circle cx="20" cy="20" r="1.5" fill="#f3d9a4"/>
    </svg>`,
    ribbon: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 30 C40 10 60 10 80 30 C60 45 60 55 80 70 C60 90 40 90 20 70 C40 55 40 45 20 30Z" stroke="#e8b768" stroke-width="2.5" fill="none"/>
      <circle cx="50" cy="50" r="6" fill="#e8b768"/>
    </svg>`,
    crane: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 60 L50 35 L80 55 L58 50 L65 75 L50 55 L38 72 L42 50Z" fill="#f7ecd9" opacity="0.9"/>
      <circle cx="50" cy="35" r="3" fill="#e8b768"/>
    </svg>`,
    candle: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 20 C56 30 58 36 50 42 C42 36 44 30 50 20Z" fill="#e8b768"/>
      <path d="M50 26 C53 32 54 35 50 39 C46 35 47 32 50 26Z" fill="#f7ecd9"/>
      <rect x="42" y="42" width="16" height="38" rx="3" fill="#ef93a0" opacity="0.85"/>
      <rect x="42" y="42" width="16" height="6" fill="#f3d9a4" opacity="0.6"/>
    </svg>`,
    cloud: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="45" cy="55" rx="26" ry="16" fill="#7c93c9" opacity="0.85"/>
      <ellipse cx="65" cy="48" rx="18" ry="13" fill="#7c93c9" opacity="0.85"/>
      <circle cx="25" cy="25" r="1.6" fill="#f7ecd9"/>
      <circle cx="75" cy="20" r="1.2" fill="#f7ecd9"/>
      <circle cx="60" cy="15" r="1.4" fill="#f7ecd9"/>
    </svg>`,
    sparkle: `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 15 L56 44 L85 50 L56 56 L50 85 L44 56 L15 50 L44 44Z" fill="#e8b768"/>
      <path d="M78 20 L80 27 L87 29 L80 31 L78 38 L76 31 L69 29 L76 27Z" fill="#7fc9a3"/>
      <path d="M22 68 L24 74 L30 76 L24 78 L22 84 L20 78 L14 76 L20 74Z" fill="#ef93a0"/>
    </svg>`
  };

  const gallerySlides = [
    { icon: svgIcons.lantern,  text: '天天快乐', tag: '中文' },
    { icon: svgIcons.blossom,  text: 'Happy every day', tag: 'English' },
    { icon: svgIcons.moon,     text: '毎日楽しく', tag: '日本語' },
    { icon: svgIcons.firework, text: '매일 행복하세요', tag: '한국어' },
    { icon: svgIcons.heart,    text: 'Bonheur chaque jour', tag: 'Français' },
    { icon: svgIcons.ribbon,   text: 'Feliz cada día', tag: 'Español' },
    { icon: svgIcons.crane,    text: 'Jeden Tag glücklich', tag: 'Deutsch' },
    { icon: svgIcons.candle,   text: 'Felice ogni giorno', tag: 'Italiano' },
    { icon: svgIcons.cloud,    text: 'Счастья каждый день', tag: 'Русский' },
    { icon: svgIcons.sparkle,  text: '愿你 天天快乐', tag: 'Wishing You Joy, Every Single Day' }
  ];

  const overlay = document.getElementById('galleryOverlay');
  const slideEl = document.getElementById('gallerySlide');
  const progressEl = document.getElementById('galleryProgress');
  const openBtn = document.getElementById('openGallery');
  const closeBtn = document.getElementById('closeGallery');

  gallerySlides.forEach((_, i) => {
    const dot = document.createElement('span');
    dot.dataset.index = i;
    progressEl.appendChild(dot);
  });
  const dots = progressEl.querySelectorAll('span');

  let galleryTimer = null;
  let galleryIndex = 0;
  const SLIDE_INTERVAL = 480; // 图片切换速度

  function renderSlide(i){
    const s = gallerySlides[i];
    slideEl.classList.remove('show');
    setTimeout(() => {
      slideEl.innerHTML = `${s.icon}<div class="gallery-caption">${s.text}<span class="lang-tag">${s.tag}</span></div>`;
      slideEl.classList.add('show');
      dots.forEach((d, di) => d.classList.toggle('active', di === i));
    }, 160);
  }

  function startGallery(){
    galleryIndex = 0;
    renderSlide(galleryIndex);
    clearInterval(galleryTimer);
    galleryTimer = setInterval(() => {
      galleryIndex++;
      if (galleryIndex >= gallerySlides.length) {
        clearInterval(galleryTimer); // 停在最后一张祝福语上
        return;
      }
      renderSlide(galleryIndex);
    }, SLIDE_INTERVAL);
  }

  function openGallery(){
    overlay.classList.add('open');
    startGallery();
  }
  function closeGallery(){
    overlay.classList.remove('open');
    clearInterval(galleryTimer);
    slideEl.classList.remove('show');
  }

  openBtn.addEventListener('click', openGallery);
  closeBtn.addEventListener('click', closeGallery);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeGallery();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeGallery();
  });

  /* ---------- 朋友的照片：拍立得快闪墙 ----------
     图片先占位，之后把 photo1.jpg ~ photo8.jpg 换成真实照片放在
     和本 html 同一目录下即可自动显示；找不到图片时会展示占位卡片。
  */
  const placeholderIcon = `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="38" r="16" fill="#f3d9a4"/>
    <path d="M22 82 C22 60 35 50 50 50 C65 50 78 60 78 82Z" fill="#f3d9a4"/>
  </svg>`;

  const photoFiles = ['photos/photo1.jpg','photos/photo2.jpg','photos/photo3.jpg','photos/photo4.jpg','photos/photo5.jpg','photos/photo6.jpg','photos/photo7.jpg','photos/photo8.jpg'];

  const photoSlides = photoFiles.map((file, i) => ({
    src: file,
    rotate: (i % 2 === 0 ? -1 : 1) * (3 + (i % 3) * 2)
  }));

  const photoOverlay = document.getElementById('photoOverlay');
  const photoSlideEl = document.getElementById('photoSlide');
  const photoProgressEl = document.getElementById('photoProgress');
  const openPhotosBtn = document.getElementById('openPhotos');
  const closePhotosBtn = document.getElementById('closePhotos');

  photoSlides.forEach((_, i) => {
    const dot = document.createElement('span');
    photoProgressEl.appendChild(dot);
  });
  const photoDots = photoProgressEl.querySelectorAll('span');

  let photoTimer = null;
  let photoIndex = 0;
  const PHOTO_INTERVAL = 480;

  function renderPhotoSlide(i){
    const p = photoSlides[i];
    photoSlideEl.classList.remove('show');
    setTimeout(() => {
      photoSlideEl.innerHTML = `
        <div class="polaroid" style="transform: rotate(${p.rotate}deg);">
          <div class="tape"></div>
          <img src="${p.src}" alt=""
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder-photo', innerHTML:\`${placeholderIcon}\`}))" />
        </div>`;
      photoSlideEl.classList.add('show');
      photoDots.forEach((d, di) => d.classList.toggle('active', di === i));
    }, 160);
  }

  function startPhotos(){
    photoIndex = 0;
    renderPhotoSlide(photoIndex);
    clearInterval(photoTimer);
    photoTimer = setInterval(() => {
      photoIndex++;
      if (photoIndex >= photoSlides.length) {
        clearInterval(photoTimer);
        return;
      }
      renderPhotoSlide(photoIndex);
    }, PHOTO_INTERVAL);
  }

  function openPhotos(){
    photoOverlay.classList.add('open');
    startPhotos();
  }
  function closePhotos(){
    photoOverlay.classList.remove('open');
    clearInterval(photoTimer);
    photoSlideEl.classList.remove('show');
  }

  openPhotosBtn.addEventListener('click', openPhotos);
  closePhotosBtn.addEventListener('click', closePhotos);
  photoOverlay.addEventListener('click', (e) => {
    if (e.target === photoOverlay) closePhotos();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && photoOverlay.classList.contains('open')) closePhotos();
  });
</script>

</body>
</html>
